<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=https://is.gd/westernintapplock" />
  <title>Western AppLock KSA - Live Cloud Portal</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b1120;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px 28px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #334155;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { margin: 0 0 8px; font-size: 1.15rem; color: #fff; }
    p { margin: 0; font-size: 0.85rem; color: #94a3b8; line-height: 1.4; }
    a { color: #38bdf8; font-weight: bold; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Western AppLock KSA</h2>
    <p>Opening Live Cloud Portal...</p>
    <p style="margin-top: 14px;"><a href="https://is.gd/westernintapplock">Click here if not redirected automatically</a></p>
  </div>
  <script>
    window.location.replace('https://is.gd/westernintapplock');
  </script>
</body>
</html>
