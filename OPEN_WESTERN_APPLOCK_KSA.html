<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Western AppLock KSA - Connecting...</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b1120;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px 28px;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #334155;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { margin: 0 0 8px; font-size: 1.15rem; color: #fff; }
    p { margin: 0; font-size: 0.85rem; color: #94a3b8; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Western AppLock KSA</h2>
    <p id="statusText">Locating live Cloud Relay Server automatically...</p>
  </div>
  <script>
    (async () => {
      // 1. Check if running locally on this laptop first
      try {
        const controller = new AbortController();
        setTimeout(() => controller.abort(), 800);
        const localResp = await fetch('http://localhost:8080/api/status', { signal: controller.signal, mode: 'no-cors' });
        if (localResp) {
          window.location.replace('http://localhost:8080');
          return;
        }
      } catch (_) {}

      // 2. Fetch latest auto-synced public HTTPS URL from ntfy.sh
      try {
        const res = await fetch('https://ntfy.sh/western_applock_sync_3125210946/raw?poll=1&since=all&_t=' + Date.now(), { cache: 'no-store' });
        const text = await res.text();
        const lines = text.trim().split('\n').map(s => s.trim()).filter(s => s.startsWith('https://'));
        if (lines.length > 0) {
          window.location.replace(lines[lines.length - 1]);
          return;
        }
      } catch (_) {}

      document.getElementById('statusText').textContent = 'Could not reach Cloud Server. Make sure START_CLOUD_SERVER.bat is running.';
    })();
  </script>
</body>
</html>
