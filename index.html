<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>westernintapplock.cloudflare • Western AppLock KSA</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1120;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b1120;
      z-index: 10;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0,0,0,0.7);
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      margin: 0 auto 16px;
      display: block;
      border: 2px solid #38bdf8;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #334155;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 16px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { margin: 0 0 6px; font-size: 1.3rem; color: #fff; }
    p { margin: 0; font-size: 0.9rem; color: #94a3b8; }
    #portalFrame {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      margin: 0;
      padding: 0;
      display: none;
      z-index: 20;
      background: #0b1120;
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="card">
      <img src="logo_western.png" alt="Western AppLock" class="logo" onerror="this.style.display='none'" />
      <h2>Western AppLock KSA</h2>
      <div id="loader" class="spinner"></div>
      <p id="status">Connecting to Western International Cloud Portal...</p>
    </div>
  </div>
  <iframe id="portalFrame" allow="fullscreen; clipboard-read; clipboard-write"></iframe>

  <script>
    (async function() {
      const status = document.getElementById('status');
      const splash = document.getElementById('splash');
      const frame = document.getElementById('portalFrame');

      function openInMaskFrame(url) {
        try {
          history.replaceState(null, 'westernintapplock.cloudflare', window.location.pathname);
        } catch (_) {}
        frame.src = url;
        frame.style.display = 'block';
        frame.onload = () => {
          splash.style.display = 'none';
        };
        setTimeout(() => {
          splash.style.display = 'none';
        }, 1800);
      }

      try {
        const res = await fetch('https://ntfy.sh/western_applock_sync_3125210946/raw?poll=1&since=all&_t=' + Date.now(), { cache: 'no-store' });
        const text = await res.text();
        const lines = text.trim().split('\n').map(s => s.trim()).filter(s => s.startsWith('https://'));
        if (lines.length > 0) {
          const targetUrl = lines[lines.length - 1];
          openInMaskFrame(targetUrl);
          return;
        }
      } catch (e) {
        console.error(e);
      }

      openInMaskFrame('https://westernapplockksa.onrender.com');
    })();
  </script>
</body>
</html>
