<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Western AppLock KSA • Cloud Portal</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b1120;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0,0,0,0.7);
    }
    .logo {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      margin: 0 auto 16px;
      display: block;
      border: 2px solid #38bdf8;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #334155;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 16px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { margin: 0 0 6px; font-size: 1.3rem; color: #fff; }
    p { margin: 0 0 16px; font-size: 0.9rem; color: #94a3b8; }
    .btn {
      display: none;
      margin-top: 16px;
      background: #0284c7;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="logo_western.png" alt="Western AppLock" class="logo" />
    <h2>Western AppLock KSA</h2>
    <div id="loader" class="spinner"></div>
    <p id="status">Connecting to live cloud portal...</p>
    <a id="btn" class="btn" href="#">Enter Portal Now ➔</a>
  </div>

  <script>
    (async function() {
      const status = document.getElementById('status');
      const loader = document.getElementById('loader');
      const btn = document.getElementById('btn');

      try {
        const res = await fetch('https://ntfy.sh/western_applock_sync_3125210946/raw?poll=1&since=all&_t=' + Date.now(), { cache: 'no-store' });
        const text = await res.text();
        const lines = text.trim().split('\n').map(s => s.trim()).filter(s => s.startsWith('https://'));
        
        if (lines.length > 0) {
          const targetUrl = lines[lines.length - 1];
          status.innerText = 'Redirecting to ' + targetUrl;
          btn.href = targetUrl;
          btn.style.display = 'inline-block';
          window.location.replace(targetUrl);
          return;
        }
      } catch (e) {
        console.error(e);
      }

      // Fallback direct link
      const fallback = 'https://sectors-gazette-banner-keen.trycloudflare.com';
      status.innerText = 'Click below to enter:';
      loader.style.display = 'none';
      btn.href = fallback;
      btn.style.display = 'inline-block';
    })();
  </script>
</body>
</html>
